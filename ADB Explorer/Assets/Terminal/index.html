<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ADB Explorer Terminal</title>
    <link rel="stylesheet" href="./vendor/xterm.css" />
    <style>
        :root {
            color-scheme: dark;
            font-family: "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body,
        #workspace,
        #terminal {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0c0c0c;
        }

        #workspace {
            position: relative;
            padding: 4px;
        }

        #terminal .xterm-viewport {
            scrollbar-color: #666 #1b1b1b;
            scrollbar-width: thin;
        }

        #search-panel {
            position: absolute;
            z-index: 20;
            top: 10px;
            right: 18px;
            display: none;
            align-items: center;
            gap: 5px;
            padding: 6px;
            border: 1px solid #454545;
            border-radius: 6px;
            background: #252526;
            box-shadow: 0 5px 18px rgb(0 0 0 / 45%);
        }

        #search-panel.visible {
            display: flex;
        }

        #search-input {
            width: 230px;
            padding: 5px 8px;
            border: 1px solid #555;
            border-radius: 4px;
            outline: none;
            color: #f3f3f3;
            background: #1e1e1e;
            font: 12px "Segoe UI", sans-serif;
        }

        #search-input:focus {
            border-color: #007acc;
        }

        #search-count {
            min-width: 44px;
            color: #cfcfcf;
            text-align: center;
            font: 11px "Segoe UI", sans-serif;
        }

        .action {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 4px;
            color: #ddd;
            background: transparent;
            cursor: pointer;
        }

        .action:hover {
            border-color: #555;
            background: #37373d;
        }

        #status,
        #toast {
            position: absolute;
            z-index: 30;
            pointer-events: none;
            color: #ddd;
            background: rgb(24 24 24 / 90%);
            font: 12px "Segoe UI", sans-serif;
        }

        #status {
            inset: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            white-space: pre-wrap;
        }

        #status.hidden,
        #toast.hidden {
            display: none;
        }

        #status.error {
            color: #f48771;
        }

        #toast {
            right: 18px;
            bottom: 14px;
            padding: 6px 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main id="workspace">
        <div id="terminal"></div>
        <div id="search-panel" aria-label="Terminal search">
            <input id="search-input" type="text" placeholder="Find" spellcheck="false" />
            <span id="search-count">0/0</span>
            <button id="search-previous" class="action" type="button" title="Previous match (Shift+Enter)">↑</button>
            <button id="search-next" class="action" type="button" title="Next match (Enter)">↓</button>
            <button id="search-close" class="action" type="button" title="Close (Esc)">✕</button>
        </div>
        <div id="status">Starting terminal renderer...</div>
        <div id="toast" class="hidden"></div>
    </main>

    <script src="./vendor/xterm.js"></script>
    <script src="./vendor/addon-fit.js"></script>
    <script src="./vendor/addon-search.js"></script>
    <script src="./vendor/addon-unicode11.js"></script>
    <script src="./vendor/addon-web-links.js"></script>
    <script src="./vendor/addon-webgl.js"></script>
    <script>
        'use strict';

        const host = window.chrome?.webview;
        const workspace = document.getElementById('workspace');
        const terminalElement = document.getElementById('terminal');
        const searchPanel = document.getElementById('search-panel');
        const searchInput = document.getElementById('search-input');
        const searchCount = document.getElementById('search-count');
        const statusElement = document.getElementById('status');
        const toastElement = document.getElementById('toast');
        const DEFAULT_FONT_SIZE = 14;
        const MIN_FONT_SIZE = 9;
        const MAX_FONT_SIZE = 30;
        const INPUT_CHUNK_SIZE = 4096;
        let currentFontSize = DEFAULT_FONT_SIZE;
        let lastColumns = 0;
        let lastRows = 0;
        let fitFrame = 0;
        let toastTimer = 0;
        let inputSequence = 0;
        let pendingInput = null;
        const inputQueue = [];

        function post(message) {
            host?.postMessage(message);
        }

        function enqueueInput(type, data = '') {
            if (type !== 'interrupt' && !data)
                return;

            inputQueue.push({ type, data, offset: 0 });
            pumpInput();
        }

        function pumpInput() {
            if (pendingInput || inputQueue.length === 0)
                return;

            const input = inputQueue[0];
            const id = ++inputSequence;
            if (input.type === 'interrupt') {
                pendingInput = { id, end: 0 };
                post({ type: 'interrupt', id });
                return;
            }

            let end = Math.min(input.offset + INPUT_CHUNK_SIZE, input.data.length);
            if (input.type === 'input' && end < input.data.length && end > input.offset) {
                const last = input.data.charCodeAt(end - 1);
                const next = input.data.charCodeAt(end);
                if (last >= 0xd800 && last <= 0xdbff && next >= 0xdc00 && next <= 0xdfff)
                    end--;
            }

            const chunk = input.data.slice(input.offset, end);
            pendingInput = { id, end };
            post({
                type: input.type,
                id,
                data: input.type === 'inputBinary' ? btoa(chunk) : chunk
            });
        }

        function acknowledgeInput(id) {
            if (!pendingInput || pendingInput.id !== id || inputQueue.length === 0)
                return;

            const input = inputQueue[0];
            if (input.type === 'interrupt' || pendingInput.end >= input.data.length)
                inputQueue.shift();
            else
                input.offset = pendingInput.end;

            pendingInput = null;
            pumpInput();
        }

        function base64ToBytes(encoded) {
            const binary = atob(encoded || '');
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index++)
                bytes[index] = binary.charCodeAt(index);
            return bytes;
        }

        function showToast(message) {
            clearTimeout(toastTimer);
            toastElement.textContent = message;
            toastElement.classList.remove('hidden');
            toastTimer = window.setTimeout(() => toastElement.classList.add('hidden'), 1400);
        }

        function fail(message) {
            statusElement.textContent = message;
            statusElement.classList.add('error');
            statusElement.classList.remove('hidden');
        }

        async function bootstrap() {
            if (!host)
                throw new Error('WebView2 host bridge is unavailable.');
            if (!window.Terminal || !window.FitAddon || !window.SearchAddon)
                throw new Error('Required xterm.js assets are missing.');

            const terminal = new Terminal({
                allowProposedApi: true,
                allowTransparency: false,
                convertEol: false,
                cursorBlink: true,
                cursorStyle: 'block',
                drawBoldTextInBrightColors: true,
                fastScrollModifier: 'alt',
                fontFamily: '"Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace',
                fontSize: currentFontSize,
                minimumContrastRatio: 1,
                rightClickSelectsWord: true,
                scrollback: 10000,
                smoothScrollDuration: 0,
                theme: {
                    background: '#0c0c0c',
                    foreground: '#f2f2f2',
                    cursor: '#f2f2f2',
                    cursorAccent: '#0c0c0c',
                    selectionBackground: 'rgba(38, 79, 120, 0.75)',
                    selectionInactiveBackground: 'rgba(38, 79, 120, 0.45)',
                    black: '#0c0c0c',
                    red: '#c50f1f',
                    green: '#13a10e',
                    yellow: '#c19c00',
                    blue: '#0037da',
                    magenta: '#881798',
                    cyan: '#3a96dd',
                    white: '#cccccc',
                    brightBlack: '#767676',
                    brightRed: '#e74856',
                    brightGreen: '#16c60c',
                    brightYellow: '#f9f1a5',
                    brightBlue: '#3b78ff',
                    brightMagenta: '#b4009e',
                    brightCyan: '#61d6d6',
                    brightWhite: '#f2f2f2'
                }
            });

            const fitAddon = new FitAddon.FitAddon();
            const searchAddon = new SearchAddon.SearchAddon();
            terminal.loadAddon(fitAddon);
            terminal.loadAddon(searchAddon);

            if (window.Unicode11Addon) {
                const unicodeAddon = new Unicode11Addon.Unicode11Addon();
                terminal.loadAddon(unicodeAddon);
                terminal.unicode.activeVersion = '11';
            }

            if (window.WebLinksAddon) {
                terminal.loadAddon(new WebLinksAddon.WebLinksAddon((event, uri) => {
                    post({ type: 'openExternal', data: uri });
                }));
            }

            terminal.open(terminalElement);

            if (window.WebglAddon) {
                try {
                    const webglAddon = new WebglAddon.WebglAddon();
                    webglAddon.onContextLoss(() => webglAddon.dispose());
                    terminal.loadAddon(webglAddon);
                } catch {
                    // The built-in renderer remains active when WebGL is unavailable.
                }
            }

            function fit() {
                fitFrame = 0;
                try {
                    fitAddon.fit();
                    if (terminal.cols !== lastColumns || terminal.rows !== lastRows) {
                        lastColumns = terminal.cols;
                        lastRows = terminal.rows;
                        post({ type: 'resize', cols: lastColumns, rows: lastRows });
                    }
                } catch {
                }
            }

            function scheduleFit() {
                if (!fitFrame)
                    fitFrame = requestAnimationFrame(fit);
            }

            function focusTerminal() {
                requestAnimationFrame(() => terminal.focus());
            }

            function updateSearchCount(result) {
                const count = result?.resultCount || 0;
                const current = count > 0 ? (result.resultIndex || 0) + 1 : 0;
                searchCount.textContent = `${current}/${count}`;
            }

            function searchOptions(incremental) {
                return {
                    caseSensitive: false,
                    incremental,
                    regex: false,
                    wholeWord: false,
                    decorations: {
                        matchBackground: '#515c6a',
                        matchBorder: '#8496aa',
                        matchOverviewRuler: '#8496aa',
                        activeMatchBackground: '#f0a000',
                        activeMatchBorder: '#ffd266',
                        activeMatchColorOverviewRuler: '#f0a000'
                    }
                };
            }

            function openSearch() {
                searchPanel.classList.add('visible');
                const selection = terminal.getSelection();
                if (selection && !selection.includes('\n'))
                    searchInput.value = selection;
                searchInput.focus();
                searchInput.select();
                if (searchInput.value)
                    searchAddon.findNext(searchInput.value, searchOptions(true));
            }

            function closeSearch() {
                searchPanel.classList.remove('visible');
                searchAddon.clearDecorations();
                updateSearchCount();
                focusTerminal();
            }

            function searchNext(previous) {
                const query = searchInput.value;
                if (!query)
                    return;
                if (previous)
                    searchAddon.findPrevious(query, searchOptions(false));
                else
                    searchAddon.findNext(query, searchOptions(false));
            }

            function requestCopy() {
                const selection = terminal.getSelection();
                if (selection)
                    post({ type: 'copy', data: selection.replace(/\r?\n/g, '\r\n') });
            }

            function requestPaste() {
                post({ type: 'requestPaste' });
            }

            function setFontSize(value) {
                const next = Math.max(MIN_FONT_SIZE, Math.min(MAX_FONT_SIZE, value));
                if (next === currentFontSize)
                    return;
                currentFontSize = next;
                terminal.options.fontSize = currentFontSize;
                scheduleFit();
                showToast(`Font ${currentFontSize}px`);
            }

            terminal.attachCustomKeyEventHandler(event => {
                if (event.type !== 'keydown')
                    return true;

                const key = event.key.toLowerCase();
                const commandModifier = event.ctrlKey && !event.altKey;

                if (commandModifier && key === 'f') {
                    event.preventDefault();
                    openSearch();
                    return false;
                }

                if (key === 'f3' && searchPanel.classList.contains('visible')) {
                    event.preventDefault();
                    searchNext(event.shiftKey);
                    return false;
                }

                if (commandModifier && key === 'c') {
                    event.preventDefault();
                    if (event.shiftKey || terminal.hasSelection())
                        requestCopy();
                    else
                        enqueueInput('interrupt');
                    return false;
                }

                if ((commandModifier && key === 'v') || (event.shiftKey && key === 'insert')) {
                    event.preventDefault();
                    requestPaste();
                    return false;
                }

                if (commandModifier && key === '0') {
                    event.preventDefault();
                    setFontSize(DEFAULT_FONT_SIZE);
                    return false;
                }

                if (commandModifier && (key === '+' || key === '=')) {
                    event.preventDefault();
                    setFontSize(currentFontSize + 1);
                    return false;
                }

                if (commandModifier && (key === '-' || key === '_')) {
                    event.preventDefault();
                    setFontSize(currentFontSize - 1);
                    return false;
                }

                return true;
            });

            terminal.onData(data => enqueueInput('input', data));
            terminal.onBinary(data => enqueueInput('inputBinary', data));
            searchAddon.onDidChangeResults(updateSearchCount);

            searchInput.addEventListener('input', () => {
                updateSearchCount();
                if (searchInput.value)
                    searchAddon.findNext(searchInput.value, searchOptions(true));
                else
                    searchAddon.clearDecorations();
            });

            searchInput.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    searchNext(event.shiftKey);
                } else if (event.key === 'Escape') {
                    event.preventDefault();
                    closeSearch();
                }
                event.stopPropagation();
            });

            document.getElementById('search-previous').addEventListener('click', () => searchNext(true));
            document.getElementById('search-next').addEventListener('click', () => searchNext(false));
            document.getElementById('search-close').addEventListener('click', closeSearch);

            terminalElement.addEventListener('contextmenu', event => {
                if (terminal.hasSelection())
                    requestCopy();
            });

            terminal.attachCustomWheelEventHandler(event => {
                if (!event.ctrlKey)
                    return true;
                event.preventDefault();
                setFontSize(currentFontSize + (event.deltaY < 0 ? 1 : -1));
                return false;
            });

            const resizeObserver = new ResizeObserver(scheduleFit);
            resizeObserver.observe(workspace);
            window.addEventListener('resize', scheduleFit);
            window.addEventListener('focus', () => post({ type: 'focus', focused: true }), true);
            window.addEventListener('blur', () => post({ type: 'focus', focused: false }), true);

            host.addEventListener('message', event => {
                const message = event.data || {};
                switch (message.type) {
                    case 'inputAck':
                        acknowledgeInput(message.id);
                        break;

                    case 'output': {
                        const id = message.id;
                        try {
                            terminal.write(base64ToBytes(message.data), () => {
                                post({ type: 'outputAck', id });
                            });
                        } catch {
                            post({ type: 'outputAck', id });
                        }
                        break;
                    }

                    case 'paste':
                        terminal.paste(message.data || '');
                        break;

                    case 'clear':
                        terminal.clear();
                        break;

                    case 'reset':
                        terminal.reset();
                        scheduleFit();
                        break;

                    case 'focus':
                        focusTerminal();
                        break;

                    case 'find':
                        openSearch();
                        break;
                }
            });

            scheduleFit();
            document.fonts?.ready.then(scheduleFit);
            focusTerminal();
            statusElement.classList.add('hidden');
            post({ type: 'ready', cols: terminal.cols, rows: terminal.rows });
            post({ type: 'focus', focused: true });
        }

        bootstrap().catch(error => {
            fail(`Terminal renderer failed:\n${error?.message || error}`);
        });
    </script>
</body>
</html>
